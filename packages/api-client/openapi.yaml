openapi: 3.0.3
info:
  title: Boccone AI API
  version: 0.1.0
  description: Authenticated application API for Boccone AI.
servers:
  - url: http://localhost:3000
    description: Local development
paths:
  /api/health:
    get:
      operationId: getHealth
      tags:
        - health
      summary: Check API health
      responses:
        "200":
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /api/me:
    get:
      operationId: getCurrentUser
      tags:
        - session
      summary: Get the current authenticated user
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /api/me/ai/settings:
    get:
      operationId: getAiSettings
      tags:
        - ai
      summary: Get the current user's AI provider settings
      security:
        - sessionCookie: []
      responses:
        "200":
          description: AI settings without secret values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiSettingsResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
    put:
      operationId: updateAiSettings
      tags:
        - ai
      summary: Configure the current user's AI provider
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAiSettingsRequest"
      responses:
        "200":
          description: Updated AI settings without secret values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiSettingsResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /api/me/ai/settings/api-key:
    delete:
      operationId: deleteAiApiKey
      tags:
        - ai
      summary: Delete the current user's stored AI API key
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Updated AI settings without secret values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiSettingsResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /api/me/ai/models:
    get:
      operationId: getAiModels
      tags:
        - ai
      summary: Discover models from the configured AI provider
      security:
        - sessionCookie: []
      parameters:
        - name: refresh
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Normalized provider models without secret values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiModelsResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/ErrorResponse"
        "502":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
        "504":
          $ref: "#/components/responses/ErrorResponse"
  /api/me/ai/test-connection:
    post:
      operationId: testAiConnection
      tags:
        - ai
      summary: Test the configured AI provider
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Provider connection succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiConnectionTestResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/ErrorResponse"
        "502":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /api/me/ai/interpret-meal:
    post:
      operationId: interpretMealWithAi
      tags:
        - ai
      summary: Interpret natural-language meal text into a reviewable draft
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MealInterpretationRequest"
      responses:
        "200":
          description: Reviewable meal draft; no meal is created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealDraftResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/ErrorResponse"
        "502":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
        "504":
          $ref: "#/components/responses/ErrorResponse"
  /api/me/targets:
    get:
      operationId: getDailyTargets
      tags:
        - targets
      summary: Get the current user's daily nutrition targets
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Daily nutrition targets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyTargetsResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
    put:
      operationId: updateDailyTargets
      tags:
        - targets
      summary: Replace the current user's daily nutrition targets
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DailyTargets"
      responses:
        "200":
          description: Updated daily nutrition targets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyTargetsResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /api/me/meals:
    get:
      operationId: getDailyMeals
      tags:
        - meals
      summary: Get the authenticated user's meals for a day
      security:
        - sessionCookie: []
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Meals and nutrition totals for a day
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyMealsResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
    post:
      operationId: createMeal
      tags:
        - meals
      summary: Create a manual meal for the authenticated user
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMealRequest"
      responses:
        "200":
          description: Created meal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /api/me/diary:
    get:
      operationId: getMealDiary
      tags:
        - meals
      summary: Get the authenticated user's paginated meal diary
      security:
        - sessionCookie: []
      parameters:
        - name: before
          in: query
          required: true
          description: Exclusive local calendar-date upper bound.
          schema:
            type: string
            format: date
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 14
            default: 7
        - name: foodId
          in: query
          required: false
          description: Return only meals containing this catalog food identifier.
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: Populated meal days, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiaryResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /api/me/calendar:
    get:
      operationId: getCalendarMonth
      tags:
        - calendar
      summary: Get lightweight meal activity for a calendar month
      security:
        - sessionCookie: []
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      responses:
        "200":
          description: Dates with logged meals in the requested month
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarMonthResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /api/me/meals/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getMeal
      tags:
        - meals
      summary: Get one authenticated user's meal
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Meal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
    patch:
      operationId: updateMeal
      tags:
        - meals
      summary: Update one authenticated user's meal
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMealRequest"
      responses:
        "200":
          description: Updated meal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
    delete:
      operationId: removeMeal
      tags:
        - meals
      summary: Remove one authenticated user's meal
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Meal removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealMutationResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /api/me/foods/search:
    get:
      operationId: searchFoods
      tags:
        - foods
      summary: Search the local Boccone food catalog
      security:
        - sessionCookie: []
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
            maxLength: 120
        - name: locale
          in: query
          required: false
          schema:
            type: string
            enum: [en, it]
            default: it
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Foods matching the query and the user's personal foods
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodSearchResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /api/me/food-submissions:
    post:
      operationId: createFoodSubmission
      tags:
        - foods
      summary: Propose a food for moderation and use it privately
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFoodSubmissionRequest"
      responses:
        "200":
          description: Private food and pending submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodSubmissionResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /api/me/saved-meals:
    get:
      operationId: listSavedMeals
      tags:
        - saved-meals
      summary: List the authenticated user's saved meal templates with routines
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Saved meal templates ranked for quick reuse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedMealsResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
    post:
      operationId: createSavedMeal
      tags:
        - saved-meals
      summary: Create a saved meal template, optionally with routine metadata
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSavedMealRequest"
      responses:
        "200":
          description: Created saved meal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedMealResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /api/admin/meals:
    get:
      operationId: listAdminMeals
      tags:
        - admin
      summary: List meals for administrators
      security:
        - sessionCookie: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 255
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: category
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/MealCategory"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Meals visible to operations staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminGlobalMealsResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
  /api/admin/meals/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getAdminMeal
      tags:
        - admin
      summary: Get one meal for administrators
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Meal details and owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminGlobalMealResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /api/admin/foods:
    get:
      operationId: listAdminFoods
      tags:
        - admin
      summary: Browse the food catalog
      security:
        - sessionCookie: []
      parameters:
        - name: search
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 255 }
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/FoodStatus" }
        - name: sourceType
          in: query
          required: false
          schema: { $ref: "#/components/schemas/FoodSourceType" }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Catalog foods
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFoodsResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
  /api/admin/foods/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getAdminFood
      tags: [admin]
      summary: Inspect one catalog food
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Food details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFoodResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
    patch:
      operationId: updateAdminFood
      tags: [admin]
      summary: Correct catalog food data
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminFoodUpdateRequest" }
      responses:
        "200":
          description: Updated food
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFoodResponse" }
        "400": { $ref: "#/components/responses/ErrorResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
  /api/admin/food-submissions:
    get:
      operationId: listAdminFoodSubmissions
      tags: [admin]
      summary: List food submissions for moderation
      security: [{ sessionCookie: [] }]
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/FoodStatus", default: PENDING_REVIEW }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Moderation queue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFoodSubmissionsResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
  /api/admin/food-submissions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getAdminFoodSubmission
      tags: [admin]
      summary: Inspect one food submission
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Submission review workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFoodSubmissionResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /api/admin/food-submissions/{id}/approve:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: approveFoodSubmission
      tags: [admin]
      summary: Approve a food submission
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Approved submission
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFoodSubmissionResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /api/admin/food-submissions/{id}/reject:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: rejectFoodSubmission
      tags: [admin]
      summary: Reject a food submission
      security: [{ sessionCookie: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminFoodRejectRequest" }
      responses:
        "200":
          description: Rejected submission
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFoodSubmissionResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "409": { $ref: "#/components/responses/ErrorResponse" }
  /api/admin/food-submissions/{id}/merge:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: mergeFoodSubmission
      tags: [admin]
      summary: Merge a duplicate submission into a catalog food
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminFoodMergeRequest" }
      responses:
        "200":
          description: Merged submission
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFoodSubmissionResponse" }
        "401": { $ref: "#/components/responses/ErrorResponse" }
        "403": { $ref: "#/components/responses/ErrorResponse" }
        "404": { $ref: "#/components/responses/ErrorResponse" }
  /api/me/saved-meals/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getSavedMeal
      tags:
        - saved-meals
      summary: Get one authenticated user's saved meal template
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Saved meal template with current catalog nutrition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedMealResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
    patch:
      operationId: updateSavedMeal
      tags:
        - saved-meals
      summary: Update one authenticated user's saved meal template
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSavedMealRequest"
      responses:
        "200":
          description: Updated saved meal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedMealResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
    delete:
      operationId: removeSavedMeal
      tags:
        - saved-meals
      summary: Remove a saved meal template (historical meals are untouched)
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Saved meal removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedMealMutationResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /api/me/saved-meals/{id}/routine:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: putSavedMealRoutine
      tags:
        - saved-meals
      summary: Create or replace the routine metadata for a saved meal
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedMealRoutineInput"
      responses:
        "200":
          description: Saved meal with upserted routine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedMealResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
    delete:
      operationId: deleteSavedMealRoutine
      tags:
        - saved-meals
      summary: Remove the routine metadata (the saved meal itself is preserved)
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Saved meal without routine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedMealResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /api/me/saved-meals/{id}/use:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: useSavedMeal
      tags:
        - saved-meals
      summary: Record usage after a meal created from this template is persisted
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UseSavedMealRequest"
      responses:
        "200":
          description: Updated usage metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedMealResponse"
        "400":
