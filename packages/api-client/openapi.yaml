components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: better-auth.session_token
  parameters:
    AdminAnalyticsRange:
      name: range
      in: query
      required: false
      schema:
        type: string
        enum: [7d, 30d, 90d, custom]
        default: 30d
    AdminAnalyticsFrom:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date
    AdminAnalyticsTo:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date
  responses:
    ErrorResponse:
      description: API error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - bad_request
                - unauthorized
                - forbidden
                - not_found
                - conflict
                - validation_error
                - internal_error
                - ai_not_configured
                - ai_invalid_credentials
                - ai_rate_limited
                - ai_provider_unavailable
                - ai_model_not_found
                - ai_model_not_accessible
                - ai_model_not_selected
                - ai_model_discovery_unavailable
                - ai_model_unsupported
                - ai_timeout
                - ai_cancelled
                - ai_invalid_response
                - ai_secret_unavailable
                - ai_unknown_error
            message:
              type: string
            requestId:
              type: string
    HealthResponse:
      type: object
      required:
        - status
        - service
        - version
        - requestId
        - timestamp
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          enum: [boccone-api]
        version:
          type: string
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
    AuthUser:
      type: object
      required:
        - id
        - name
        - email
        - emailVerified
        - image
        - role
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        emailVerified:
          type: boolean
        image:
          type: string
          nullable: true
        role:
          type: string
          enum: [user, admin]
    MeResponse:
      type: object
      required:
        - user
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
    DailyTargets:
      type: object
      required:
        - calories
        - proteinGrams
        - carbohydratesGrams
        - fatGrams
      properties:
        calories:
          type: integer
          minimum: 1
          maximum: 100000
          nullable: true
        proteinGrams:
          type: integer
          minimum: 1
          maximum: 10000
          nullable: true
        carbohydratesGrams:
          type: integer
          minimum: 1
          maximum: 10000
          nullable: true
        fatGrams:
          type: integer
          minimum: 1
          maximum: 10000
          nullable: true
    DailyTargetsResponse:
      type: object
      required:
        - targets
      properties:
        targets:
          $ref: "#/components/schemas/DailyTargets"
    MealCategory:
      type: string
      enum: [breakfast, lunch, dinner, snack]
    CreateMealRequest:
      oneOf:
        - $ref: "#/components/schemas/ManualMealRequest"
        - $ref: "#/components/schemas/FoodMealRequest"
    ManualMealRequest:
      type: object
      required:
        - name
        - category
        - date
        - calories
        - proteinGrams
        - carbohydratesGrams
        - fatGrams
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        category:
          $ref: "#/components/schemas/MealCategory"
        date:
          type: string
          format: date
        calories:
          type: integer
          minimum: 0
          maximum: 100000
        proteinGrams:
          type: integer
          minimum: 0
          maximum: 10000
        carbohydratesGrams:
          type: integer
          minimum: 0
          maximum: 10000
        fatGrams:
          type: integer
          minimum: 0
          maximum: 10000
        notes:
          type: string
          maxLength: 2000
          nullable: true
    FoodMealRequest:
      type: object
      required:
        - name
        - category
        - date
        - entries
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        category:
          $ref: "#/components/schemas/MealCategory"
        date:
          type: string
          format: date
        notes:
          type: string
          maxLength: 2000
          nullable: true
        entries:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/MealFoodEntryInput"
    UpdateMealRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        category:
          $ref: "#/components/schemas/MealCategory"
        date:
          type: string
          format: date
        calories:
          type: integer
          minimum: 0
          maximum: 100000
        proteinGrams:
          type: integer
          minimum: 0
          maximum: 10000
        carbohydratesGrams:
          type: integer
          minimum: 0
          maximum: 10000
        fatGrams:
          type: integer
          minimum: 0
          maximum: 10000
        notes:
          type: string
          maxLength: 2000
          nullable: true
        entries:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/MealFoodEntryUpdateInput"
    Meal:
      type: object
      required:
        - id
        - name
        - category
        - date
        - calories
        - proteinGrams
        - carbohydratesGrams
        - fatGrams
        - nutritionIncomplete
        - notes
        - source
        - entries
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        name:
          type: string
        category:
          $ref: "#/components/schemas/MealCategory"
        date:
          type: string
          format: date
        calories:
          type: integer
          minimum: 0
          maximum: 100000
        proteinGrams:
          type: integer
          minimum: 0
          maximum: 10000
        carbohydratesGrams:
          type: integer
          minimum: 0
          maximum: 10000
        fatGrams:
          type: integer
          minimum: 0
          maximum: 10000
        nutritionIncomplete:
          type: boolean
        notes:
          type: string
          maxLength: 2000
          nullable: true
        source:
          type: string
          enum: [manual]
        entries:
          type: array
          items:
            $ref: "#/components/schemas/MealFoodEntry"
        createdAt:
          type: string
          format: date-time
